services:

  backend:
    build:
      context: ./backend

    container_name: codepilot-backend

    ports:
      - "8000:8000"

    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL}

    volumes:
      - codepilot-data:/app/data

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend

      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8000/api}

    container_name: codepilot-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    restart: unless-stopped


volumes:
  codepilot-data: